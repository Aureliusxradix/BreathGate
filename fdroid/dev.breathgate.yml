# F-Droid metadata for fdroiddata.
#
# ⚠ THIS IS THE TEMPLATE, NOT THE SUBMITTABLE FILE. The repository URL, the version, the version
# code and the release tag are substituted by publish/publish.sh from the places that actually
# decide them — publish/repo.env and app/build.gradle.kts. **Submit the copy from the PUBLIC tree.**
# Nothing may ship with a placeholder still in it, and publish.sh aborts if one survives.
#
# ⚠ READ BEFORE SUBMITTING — the signature question, and what changed about it.
#
#   f-droid.org normally BUILDS FROM SOURCE AND SIGNS WITH F-DROID'S OWN KEY. Android identifies
#   an app by its signature, so an F-Droid-signed build is a DIFFERENT APP to the operating
#   system: an existing install cannot update to it without being removed first, and the two
#   install bases can never cross over afterwards. That was the single reason this stayed parked.
#
# ⭐ IT IS AVOIDABLE, AND THAT IS NOW MEASURED RATHER THAN HOPED.
#   F-Droid's reproducible-builds path has them rebuild from source, verify the result matches the
#   developer's published APK bit for bit, and then ship the DEVELOPER'S signed APK — one lineage
#   for everybody. It requires the build to be deterministic, which Android Gradle builds are
#   famously not, by default.
#
#   Tested 2026-08-16, three independent builds of the same source on the same toolchain:
#     · different directories, different times          → identical
#     · different path LENGTH, TZ=UTC, LC_ALL=C         → identical
#     SHA-256 of the unsigned APK, all three: 7debc87781a6b59db83cb729aef03ffc4d794e517ea1c1eea6690780c52ae24f
#
#   Why it holds here: `isMinifyEnabled = false` removes R8, which is the usual culprit; the
#   Gradle wrapper pins 8.11.1; AGP and Kotlin are pinned; and nothing injects a build timestamp.
#   ⚠ Still unproven CROSS-MACHINE — F-Droid builds on their own JDK and build-tools, and those
#   are the remaining variables. Same-machine determinism is necessary, not sufficient. But it is
#   the hurdle that usually fails, and it did not.
#
# `Binaries:` below is what asks for that path: it tells F-Droid where the developer's own APK
# lives so it can be verified against their rebuild instead of replaced by it.

