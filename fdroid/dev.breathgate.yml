# F-Droid metadata for fdroiddata.
#
# ⚠ THIS IS THE TEMPLATE, NOT THE SUBMITTABLE FILE. The repository URL, the version, the version
# code and the release tag are substituted by publish/publish.sh from the places that actually
# decide them — publish/repo.env and app/build.gradle.kts. **Submit the copy from the PUBLIC tree.**
# Nothing may ship with a placeholder still in it, and publish.sh aborts if one survives.
#
# ⚠ READ BEFORE SUBMITTING — the signature consequence, which is not obvious and is not
# reversible for existing installs:
#
#   f-droid.org normally BUILDS FROM SOURCE AND SIGNS WITH F-DROID'S OWN KEY. Android identifies
#   an app by its signature, so an F-Droid-signed BreathGate is a DIFFERENT APP to the operating
#   system than the one distributed from the release channel. Anyone already running the
#   release-signed build cannot update to it — they would have to uninstall, losing their
#   settings, and reinstall. The two install bases can never cross over afterwards.
#
#   The way out is `AllowedAPKSigningKeys` plus F-Droid's reproducible-builds process: F-Droid
#   rebuilds, verifies their output matches the published APK bit for bit, and then ships the
#   ORIGINAL signed APK, keeping one lineage for everyone. That is the right destination, but
#   Android Gradle builds are not reproducible by default — build timestamps, R8 nondeterminism,
#   signing-block ordering — so it is a project, not a checkbox.
#
#   The key is recorded below either way: it is what makes that path possible later, and it costs
#   nothing now.

