# Capped deliberately: SD has 7.4G RAM total on a 4-thread i7-7600U. A modest heap keeps the
# build slow-but-safe rather than fast-and-OOM. This is a batch job on a server that is also
# the LAN's DNS — it must never be able to starve the box.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
kotlin.code.style=official
